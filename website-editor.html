<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visueller Editor | Platino Ladies</title><style>*{box-sizing:border-box}body{margin:0;background:#130d20;color:#f4eaff;font:14px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#241731;border-bottom:1px solid #70518d}button,select,input,textarea{font:inherit;padding:9px;border-radius:9px;border:1px solid #80649a;background:#38264e;color:white}button{cursor:pointer}button:hover{background:#654483}a{color:#e3c9ff}.grow{flex:1}.hint{padding:9px 18px;color:#d6bfe9}.stage{height:calc(100vh - 140px);min-height:450px}iframe{width:100%;height:100%;border:0;background:white}.panel{position:fixed;right:16px;top:110px;background:#261934;border:1px solid #9974ba;border-radius:15px;padding:15px;max-width:300px;box-shadow:0 15px 40px #0008;z-index:2}.panel[hidden]{display:none}.panel button{margin:4px} .panel textarea{width:100%;min-height:115px;background:#160e23;color:white;border:1px solid #9974ba;border-radius:9px;padding:10px;resize:vertical}.panel label{display:block;margin:12px 0 5px}.danger{background:#6c304d}#status{font-size:12px;color:#d6bfe9}input[type=file]{max-width:230px}@media(max-width:650px){.stage{height:65vh}.panel{top:auto;bottom:10px;right:10px;left:10px;max-width:none}}</style></head><body><header><a href="leitungszentrale.html">← Leitung</a><strong>✧ Website bearbeiten</strong><select id="page"><option value="index.html">Startseite</option><option value="ueber-uns.html">Über uns</option><option value="konzept.html">Konzept</option><option value="leitung.html">Leitung</option><option value="wochenplan.html">Wochenplan</option><option value="outfit.html">Uniform</option><option value="begleiter.html">Begleiter</option><option value="rangsystem.html">Rangsystem</option><option value="bewerbungen.html">Bewerbungen</option><option value="informationen.html">Informationen</option><option value="voraussetzungen.html">Voraussetzungen</option><option value="warteliste.html">Warteliste</option></select><span class="grow"></span><button id="add">+ Abschnitt</button><button id="undo">↶ Rückgängig</button><button id="save">Entwurf speichern</button><button id="export">HTML exportieren</button></header><div class="hint">Tippe auf einen Text und ändere ihn im eingeblendeten Textfeld. Danach auf „Text übernehmen“ tippen. Klicke auf ein Bild, um es auszutauschen. Änderungen bleiben zunächst nur in diesem Browser.</div><div class="stage"><iframe id="view" title="Website im Bearbeitungsmodus" sandbox="allow-same-origin"></iframe></div><aside class="panel" id="panel" hidden><strong id="element">Element</strong><p>Direkt bearbeiten oder Element verschieben</p><div id="textFields"><label for="textValue">Text direkt ändern</label><textarea id="textValue" placeholder="Hier schreiben …"></textarea><button id="applyText">✓ Text übernehmen</button></div><button id="editText" hidden>✎ Text bearbeiten</button><button id="changeImage">▧ Bild austauschen</button><button id="up">↑</button><button id="down">↓</button><button id="delete" class="danger">Löschen</button><button id="close">Schließen</button><p id="status"></p></aside><input id="image" type="file" accept="image/*" hidden><script>
'use strict';const $=id=>document.getElementById(id),key='pl-visual-editor-v1-',frame=$('view');let doc=null,selected=null,history=[],page='index.html';function msg(t){$('status').textContent=t}function clean(d){d.querySelectorAll('[data-pl-editor-style]').forEach(n=>n.remove());d.querySelectorAll('[contenteditable],[data-pl-selected]').forEach(n=>{n.removeAttribute('contenteditable');n.removeAttribute('data-pl-selected')});return '<!doctype html>\n'+d.documentElement.outerHTML}function snapshot(){if(doc){history.push(clean(doc));if(history.length>30)history.shift()}}function restore(html){const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,base,meta[http-equiv="refresh"]').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes])if(a.name.startsWith('on'))n.removeAttribute(a.name)});return d}function show(){selected=null;$('panel').hidden=true;if(!doc)return;const d=restore(clean(doc));const st=d.createElement('style');st.dataset.plEditorStyle='';st.textContent='[data-pl-selected]{outline:2px solid #b78bea!important;outline-offset:3px!important} [contenteditable="true"]{outline:2px dashed #a479cc!important;cursor:text!important}';d.head.append(st);frame.srcdoc='<!doctype html>\n'+d.documentElement.outerHTML;frame.onload=()=>{doc=frame.contentDocument;doc.addEventListener('click',click,true);doc.addEventListener('touchend',e=>{}, {passive:true});doc.addEventListener('input',()=>{msg('Nicht gespeicherte Änderungen')},true);doc.addEventListener('focusin',()=>snapshot(),true)}}function click(e){let n=e.target;if(!(n instanceof frame.contentWindow.HTMLElement))return;if(n.closest('a,button,form')){e.preventDefault();e.stopPropagation()}if(n.tagName==='IMG'){e.preventDefault();select(n);$('image').click();return}if(n.closest('input,textarea,select,video,iframe')){e.preventDefault();return}const editable=n.closest('h1,h2,h3,h4,h5,h6,p,li,span,small,strong,em,a,button,label,blockquote,figcaption')||n; n=editable;select(n);if(['P','H1','H2','H3','H4','H5','H6','SPAN','LI','STRONG','EM','SMALL','A','BUTTON','LABEL','BLOCKQUOTE','FIGCAPTION'].includes(n.tagName)){msg('Text unten im Bearbeitungsfeld ändern und auf Text übernehmen tippen')}else{msg('Element ausgewählt: Nutze rechts die Bearbeiten-Schaltfläche')}}function select(n){if(selected)selected.removeAttribute('data-pl-selected');selected=n;n.dataset.plSelected='';$('element').textContent=n.tagName.toLowerCase();$('panel').hidden=false;$('editText').hidden=true;$('textFields').hidden=n.tagName==='IMG';$('textValue').value=n.tagName==='IMG'?'':n.textContent;$('changeImage').hidden=n.tagName!=='IMG'}async function load(){page=$('page').value;history=[];let html=localStorage.getItem(key+page);if(!html){try{const r=await fetch(page,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);html=await r.text()}catch(e){alert('Seite konnte nicht geladen werden: '+e.message);return}}doc=restore(html);show()}$('applyText').onclick=()=>{if(!selected)return;snapshot();selected.textContent=$('textValue').value;msg('Text geändert – jetzt Entwurf speichern');};$('editText').onclick=()=>{if(!selected)return;const v=$('textValue').value;if(v===null)return;snapshot();selected.textContent=v;msg('Text geändert – Entwurf speichern')};$('changeImage').onclick=()=>{if(selected?.tagName==='IMG')$('image').click()};$('page').onchange=load;$('save').onclick=()=>{if(!doc)return;try{localStorage.setItem(key+page,clean(doc));msg('Entwurf im Browser gespeichert')}catch{msg('Speichern fehlgeschlagen')}};$('export').onclick=()=>{if(!doc)return;const blob=new Blob([clean(doc)],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=page;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('image').onchange=async e=>{const f=e.target.files[0];if(!selected||selected.tagName!=='IMG'||!f)return;if(f.size>2e6)return alert('Bild muss kleiner als 2 MB sein.');snapshot();const reader=new FileReader();reader.onload=()=>{selected.src=reader.result;msg('Bild geändert – bitte Entwurf speichern')};reader.readAsDataURL(f);e.target.value=''};$('add').onclick=()=>{if(!doc)return;snapshot();const section=doc.createElement('section');section.className='card';section.style.padding='24px';section.innerHTML='<h2>Neuer Abschnitt</h2><p>Hier klicken und Text bearbeiten.</p>';doc.querySelector('main')?.append(section)||doc.body.append(section);show()};$('delete').onclick=()=>{if(!selected||!confirm('Element wirklich entfernen?'))return;snapshot();selected.remove();show()};function move(dir){if(!selected)return;const p=selected.parentNode;if(!p)return;snapshot();if(dir<0&&selected.previousElementSibling)p.insertBefore(selected,selected.previousElementSibling);if(dir>0&&selected.nextElementSibling)p.insertBefore(selected.nextElementSibling,selected);show()}$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('undo').onclick=()=>{const prev=history.pop();if(prev){doc=restore(prev);show()}};$('close').onclick=()=>{$('panel').hidden=true;if(selected){selected.contentEditable='false';selected.removeAttribute('data-pl-selected')}selected=null};load();
</script></body></html>
